name: Site Web Monitor

on:
  schedule:
    # Run every 5 minutes (free & unlimited for PUBLIC repos)
    # For PRIVATE repos: GitHub Free = 2,000 mins/month — use '*/30 * * * *' instead
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

# Prevent concurrent runs — only one check at a time
concurrency:
  group: site-web-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # ── Auth State ────────────────────────────────────────
      # Either decoded from AUTH_STATE_B64 or uses automated login via
      # MTF_EMAIL and MTF_PASSWORD secrets.
      - name: Restore auth state
        run: |
          mkdir -p data
          if [ -n "$AUTH_STATE_B64" ]; then
            echo "$AUTH_STATE_B64" | base64 --decode > data/auth-state.json
            echo "Restored auth-state.json from AUTH_STATE_B64 secret."
          elif [ -n "$MTF_EMAIL" ] && [ -n "$MTF_PASSWORD" ]; then
            echo "Automated login credentials configured (MTF_EMAIL / MTF_PASSWORD)."
          else
            echo "::error::Neither AUTH_STATE_B64 nor MTF_EMAIL/MTF_PASSWORD secrets are set."
            exit 1
          fi
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          MTF_EMAIL: ${{ secrets.MTF_EMAIL }}
          MTF_PASSWORD: ${{ secrets.MTF_PASSWORD }}

      # ── Monitor State ─────────────────────────────────────
      # Persisted between runs via GitHub Actions cache.
      # Tracks seen entry IDs to prevent duplicate notifications.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: monitor-state-never-matches
          restore-keys: |
            monitor-state-

      # ── Run the Check ─────────────────────────────────────
      - name: Run monitor check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MTF_EMAIL: ${{ secrets.MTF_EMAIL }}
          MTF_PASSWORD: ${{ secrets.MTF_PASSWORD }}
          PYTHONPATH: .
        run: python -m app.main --once

      # ── Save State ────────────────────────────────────────
      # Always save, even if the check failed (to persist
      # auth_failure_notified and prevent duplicate alerts).
      - name: Save monitor state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state.json
          key: monitor-state-${{ github.run_id }}
